data:
  # FlowBench 2D LDC easy split
  file_path_train_x: /work/mech-ai/arabeh/data_prep_ns/LDC_NS_2D/processed/easy/all_ldc_train_x.npz
  file_path_train_y: /work/mech-ai/arabeh/data_prep_ns/LDC_NS_2D/processed/easy/all_ldc_train_y.npz
  file_path_test_x: /work/mech-ai/arabeh/data_prep_ns/LDC_NS_2D/processed/easy/all_ldc_test_x.npz
  file_path_test_y: /work/mech-ai/arabeh/data_prep_ns/LDC_NS_2D/processed/easy/all_ldc_test_y.npz
  resolution: 256
  batch_size: 16
  groups_per_batch: 4
  num_workers: 6

model:
  # Velocity only: u and v. Pressure is excluded.
  in_channels: 2
  base_channels: 32
  latent_mu: 4
  latent_g: 32
  latent_xi: 16
  sdf_resolution: 64

  # Run 1 architecture: geometry is inferred from the flow field.
  static_geometry: false

  # Run 1 loss weights from the paper.
  lambda_recon: 1.0
  lambda_bl: 0.0
  lambda_regime: 0.1
  lambda_geo: 0.1
  lambda_decorr: 0.01

  # Later-run structural losses are disabled.
  lambda_inv: 0.0
  lambda_swap: 0.0
  lambda_xswap: 0.0

  lr: 0.001

trainer:
  project: compositional_no_pressure_run1
  wandb: false
  accelerator: auto
  devices: 1
  max_epochs: 200
  log_every_n_steps: 10
  seed: 0

callbacks:
  checkpoint:
    dirpath: ./checkpoints/compositional_no_pressure_run1
    filename: run1-nopressure-{epoch:03d}
    monitor: val_loss_full
    mode: min
    save_top_k: 1
