data:
  # Update these paths to the unsteady LDC .npz files.
  # Supported y layouts: [N, T, C, H, W] or [N, C, T, H, W].
  # Supported x layouts: [N, 3, H, W] or [N, T, 3, H, W].
  file_path_train_x: /path/to/unsteady_ldc_train_x.npz
  file_path_train_y: /path/to/unsteady_ldc_train_y.npz
  file_path_test_x: /path/to/unsteady_ldc_test_x.npz
  file_path_test_y: /path/to/unsteady_ldc_test_y.npz
  resolution: 256
  unsteady: true
  sequence_length: 8     # number of consecutive frames per training sample
  sequence_stride: 1
  field_channels: [0, 1] # use u and v only; pressure is excluded
  batch_size: 4
  groups_per_batch: 2
  num_workers: 6

model:
  in_channels: 2         # decoder reconstructs (u, v), not pressure
  base_channels: 32
  latent_mu: 4           # regime block: log Re
  latent_g: 32           # geometry block: object shape
  latent_eta: 16         # dynamics block: evolving flow state
  latent_xi: 16          # residual block
  sdf_resolution: 64
  static_geometry: true  # recommended for unsteady: geometry comes from SDF
  unsteady: true
  lambda_recon: 1.0
  lambda_temporal: 0.1   # one-step latent rollout through Phi
  lambda_bl: 0.0
  lambda_regime: 0.1
  lambda_geo: 0.1
  lambda_decorr: 0.01
  lambda_inv: 0.1
  lambda_swap: 0.0       # steady-only implementation; keep off for sequences
  lambda_xswap: 0.0      # steady-only implementation; keep off for sequences
  lr: 0.001

trainer:
  project: compositional_unsteady_velocity
  wandb: false
  accelerator: auto
  devices: 1
  max_epochs: 200
  log_every_n_steps: 10
  seed: 0

callbacks:
  checkpoint:
    dirpath: ./checkpoints/compositional_unsteady_velocity
    filename: cae-unsteady-{epoch:03d}
    monitor: val_loss_full
    mode: min
    save_top_k: 1
